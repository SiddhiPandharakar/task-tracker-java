name: TaskTracker CI


on:

  pull_request:
    branches:
      - main

  push:
    branches:
      - main


permissions:
  contents: read



jobs:

  build-test-security:


    name: Build Test Security

    runs-on: ubuntu-latest



    services:


      postgres:

        image: postgres:16


        env:

          POSTGRES_DB: tasktracker

          POSTGRES_USER: postgres

          POSTGRES_PASSWORD: root


        ports:

          - 5432:5432


        options: >-
          --health-cmd="pg_isready -U postgres -d tasktracker"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5



    env:

      DB_URL: jdbc:postgresql://localhost:5432/tasktracker

      DB_USERNAME: postgres

      DB_PASSWORD: root



    steps:


      # Checkout

      - name: Checkout code

        uses: actions/checkout@v4



      # Java

      - name: Setup Java 21

        uses: actions/setup-java@v4

        with:

          java-version: '21'

          distribution: temurin

          cache: maven



      # Verify

      - name: Verify Environment

        run: |

          java -version

          mvn -version



      # Build + Test

      - name: Build Test

        run: |

          mvn clean verify



      # Test reports

      - name: Upload Test Reports

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: test-report

          path:

            target/surefire-reports



      # Cache OWASP database

      - name: Cache OWASP Database

        uses: actions/cache@v4

        with:

          path: ~/.m2/repository/org/owasp/dependency-check-data

          key: dependency-check-${{ runner.os }}



      # OWASP Scan

      - name: OWASP Dependency Check

        run: |

          mvn dependency-check:check

        continue-on-error: true



      # Trivy source scan

      - name: Trivy Filesystem Scan

        uses: aquasecurity/trivy-action@master

        with:

          scan-type: fs

          scan-ref: .

          severity: HIGH,CRITICAL

          exit-code: 1



      # Docker lint

      - name: Hadolint

        uses: hadolint/hadolint-action@v3.1.0

        with:

          dockerfile: Dockerfile



      # Docker build

      - name: Docker Build

        run: |

          docker build -t tasktracker-ci-test .



      # Docker image security

      - name: Trivy Docker Scan

        uses: aquasecurity/trivy-action@master

        with:

          image-ref: tasktracker-ci-test

          severity: HIGH,CRITICAL

          exit-code: 1