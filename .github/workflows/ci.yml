name: TaskTracker CI


on:

  pull_request:
    branches:
      - main

  push:
    branches:
      - main



permissions:

  contents: read



jobs:


  build-test-security:


    name: Build Test Security

    runs-on: ubuntu-latest



    services:


      postgres:


        image: postgres:16


        env:

          POSTGRES_DB: tasktracker

          POSTGRES_USER: postgres

          POSTGRES_PASSWORD: postgres



        ports:

          - 5432:5432



        options: >-

          --health-cmd "pg_isready -U postgres -d tasktracker"

          --health-interval 10s

          --health-timeout 5s

          --health-retries 5





    env:

      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/tasktracker

      SPRING_DATASOURCE_USERNAME: postgres

      SPRING_DATASOURCE_PASSWORD: postgres



    steps:



      # 1. Checkout source code

      - name: Checkout repository

        uses: actions/checkout@v4





      # 2. Setup Java 21

      - name: Setup Java 21

        uses: actions/setup-java@v4

        with:

          java-version: '21'

          distribution: temurin

          cache: maven





      # 3. Verify Java installation

      - name: Verify Java

        run: java -version





      # 4. Maven build + unit tests + Jacoco coverage

      - name: Build and Test

        run: |

          mvn clean verify





      # 5. Upload test reports even if tests fail

      - name: Upload Test Reports

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: junit-jacoco-report

          path: |

            target/surefire-reports

            target/site/jacoco





      # 6. OWASP dependency vulnerability scan

      - name: OWASP Dependency Check

        run: |

          mvn org.owasp:dependency-check-maven:check

        continue-on-error: false





      # 7. Trivy source filesystem scan

      - name: Trivy Filesystem Scan

        uses: aquasecurity/trivy-action@master

        with:

          scan-type: fs

          scan-ref: .

          severity: HIGH,CRITICAL

          exit-code: 1





      # 8. Dockerfile lint/security check

      - name: Hadolint Dockerfile Scan

        uses: hadolint/hadolint-action@v3.1.0

        with:

          dockerfile: Dockerfile





      # 9. Docker image build verification

      - name: Docker Build

        run: |

          docker build -t tasktracker-ci-test .





      # 10. Trivy Docker image scan

      - name: Trivy Docker Image Scan

        uses: aquasecurity/trivy-action@master

        with:

          image-ref: tasktracker-ci-test

          severity: HIGH,CRITICAL

          exit-code: 1