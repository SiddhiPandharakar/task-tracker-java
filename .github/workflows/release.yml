name: Release Pipeline


on:

  push:

    branches:
      - main



permissions:

  contents: read



env:

  IMAGE_NAME: tasktracker



jobs:


  build-scan-push:


    name: Build Scan Push


    runs-on: ubuntu-latest



    steps:


      - name: Checkout code

        uses: actions/checkout@v4



      - name: Docker Build

        run: |

          docker build \
          -t $IMAGE_NAME:${{ github.sha }} .



      - name: Trivy Scan

        uses: aquasecurity/trivy-action@master

        with:

          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}

          severity: HIGH,CRITICAL

          ignore-unfixed: true

          exit-code: "1"



      - name: Login Docker Registry

        uses: docker/login-action@v3

        with:

          username: ${{ secrets.DOCKER_USERNAME }}

          password: ${{ secrets.DOCKER_TOKEN }}



      - name: Create Tags

        run: |


          docker tag \
          $IMAGE_NAME:${{ github.sha }} \
          ${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:v0.1.${{ github.run_number }}



          docker tag \
          $IMAGE_NAME:${{ github.sha }} \
          ${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:${{ github.sha }}




      - name: Push SemVer Tag

        run: |

          docker push \
          ${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:v0.1.${{ github.run_number }}




      - name: Push SHA Tag

        run: |

          docker push \
          ${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:${{ github.sha }}