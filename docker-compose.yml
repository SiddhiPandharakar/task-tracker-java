version: "3.9"

services:

  app:

    image: tasktracker-test

    container_name: tasktracker-app

    build:
      context: .

    ports:
      - "8000:8080"

    environment:

      DB_URL: jdbc:postgresql://db:5432/tasktracker

      DB_USERNAME: postgres

      DB_PASSWORD: root


    depends_on:

      db:

        condition: service_healthy



  db:

    image: postgres:16

    container_name: tasktracker-db


    environment:

      POSTGRES_DB: tasktracker

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: root


    ports:

      - "5432:5432"



    healthcheck:

      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d tasktracker"
        ]

      interval: 10s

      timeout: 5s

      retries: 5