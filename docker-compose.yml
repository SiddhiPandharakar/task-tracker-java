services:

  db:
    image: postgres:16
    container_name: tasktracker-postgres

    environment:
      POSTGRES_DB: tasktracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root

    ports:
      - "5432:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  app:

    image: tasktracker:v10

    container_name: tasktracker-app

    depends_on:
      db:
        condition: service_healthy


    ports:
      - "8000:8080"


    environment:

      SERVER_PORT: 8080

      DB_URL: jdbc:postgresql://db:5432/tasktracker

      DB_USERNAME: postgres

      DB_PASSWORD: root